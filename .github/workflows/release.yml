name: Release

# Builds the Windows installer and the Linux .deb, then publishes them as the GitHub release for the
# app version in src-tauri/tauri.conf.json (e.g. v0.1.0). Rebuilding the same version replaces
# that release's files; bump the version to publish a new release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            artifact: linux-deb
            files: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      # The Windows installer ships its own ffmpeg (GPL build with NVENC, QSV and AMF), placed where
      # Tauri's externalBin expects it.
      - name: Download ffmpeg for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe"

      - run: npm ci

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Discord Ready Clip v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** download the `-setup.exe` and run it (ffmpeg is included). If SmartScreen warns, choose "More info" → "Run anyway"; the installer isn't code-signed.

            **Linux (Debian/Ubuntu/Mint):** download the `.deb` and install it with `sudo apt install ./<file>.deb` (pulls in ffmpeg).
          files: |
            artifacts/windows-installer/*.exe
            artifacts/linux-deb/*.deb
